<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Payment Terms Lens · FreeToolsLab</title>
    <meta name="description" content="What longer payment terms give one side, and what they cost the other." />
    <meta property="og:title" content="Payment Terms Lens · FreeToolsLab" />
    <meta property="og:description" content="What longer payment terms give one side, and what they cost the other." />
    <meta property="og:image" content="https://www.freetoolslab.org/tools/payment-terms-lens/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/tool.css" />
    <style>
      .tool { gap: 1.25rem; }
      @media (max-width: 479px) { .pill-extra { display: none; } }
      /* the question */
      .ask { display: grid; gap: 1rem; }
      .ask-grid { display: grid; gap: 1rem; }
      @media (min-width: 640px) { .ask-grid { grid-template-columns: 1.4fr 1fr; align-items: end; } }
      .terms { display: flex; align-items: center; gap: 0.5rem; }
      .terms .input { width: 5.5rem; text-align: center; }
      .terms .arrow { font-family: var(--font-mono); color: var(--muted); }
      .select--inline { width: auto; padding: 0.35rem 0.5rem; font-family: var(--font-mono); font-size: 0.8125rem; }
      /* the answer */
      .answer { display: grid; gap: 1rem; }
      .summary { font-size: 1.125rem; line-height: 1.5; }
      .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      @media (min-width: 768px) { .stats { grid-template-columns: repeat(4, 1fr); } }
      .stat { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); padding: 0.75rem 0.875rem; display: grid; gap: 0.25rem; }
      .stat .label { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted); }
      .stat .value { font-family: var(--font-mono); font-size: 1.375rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
      .stat--go .value { color: var(--go); }
      .stat--stop .value { color: var(--stop); }
      .stat--warn .value { color: var(--warn); }
      .assumes { font-size: 0.875rem; color: var(--muted); }
      .rates { display: grid; gap: 0.75rem; }
      @media (min-width: 640px) { .rates-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; } }
      .rate label { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); display: block; margin-bottom: 0.25rem; }
      .rate label b { color: var(--ink); font-weight: 500; }
      .example-hint { font-size: 0.8125rem; color: var(--muted); }
      /* timeline above the butterfly */
      .timeline { position: relative; height: 34px; margin: 0.25rem 0 0.5rem; }
      .timeline .line { position: absolute; left: 0; right: 0; top: 22px; height: 2px; background: var(--rule-2); }
      .timeline .span { position: absolute; top: 19px; height: 8px; background: var(--link); opacity: 0.35; border-radius: 4px; transition: left 0.4s ease, width 0.4s ease; }
      .timeline .tick { position: absolute; top: 16px; width: 2px; height: 14px; background: var(--ink); transform: translateX(-1px); transition: left 0.4s ease; }
      .timeline .lbl { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap; transition: left 0.4s ease; }
      .timeline .lbl.edge-l { transform: none; }
      .timeline .lbl.edge-r { transform: translateX(-100%); }
      .fly-note { font-family: var(--font-sans); font-size: 0.9375rem; text-align: center; }
      .fly-sub { font-size: 0.875rem; color: var(--muted); text-align: center; }
      .assumes a { color: var(--link); }
      .note { font-size: 0.875rem; color: var(--muted); }
      /* refine */
      details.card > summary { cursor: pointer; font-family: var(--font-mono); font-size: 0.8125rem; color: var(--link); list-style: none; }
      details.card > summary::-webkit-details-marker { display: none; }
      details.card > summary::before { content: "+ "; }
      details.card[open] > summary::before { content: "− "; }
      .chips { display: flex; flex-wrap: wrap; gap: 0.375rem; align-items: center; }
      .chip { font-family: var(--font-mono); font-size: 0.75rem; border: 1px solid var(--rule-2); background: var(--panel-2); color: var(--ink); border-radius: 999px; padding: 0.2rem 0.6rem; cursor: pointer; }
      .chip:hover { border-color: var(--link); }
      .chip[aria-pressed="true"] { border-color: var(--go); color: var(--go); background: var(--go-soft); }
      .chips-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
      .toggle input { accent-color: var(--go); width: 1rem; height: 1rem; }
      .tag { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted); border: 1px solid var(--rule-2); border-radius: 999px; padding: 0 0.4rem; margin-left: 0.4rem; vertical-align: middle; }
      /* the answer headline */
      .headline { font-size: clamp(1.25rem, 3.2vw, 1.75rem); line-height: 1.3; font-weight: 500; }
      .headline .num { font-family: var(--font-mono); }
      .subline { font-size: 1rem; color: var(--muted); line-height: 1.5; }
      .stat--cash .value { color: var(--link); }
      /* butterfly: both sides from one axis; PNG export builds its own SVG */
      .fly { display: grid; gap: 0.75rem; }
      .fly-head { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-family: var(--font-mono); font-size: 0.875rem; }
      .fly-head .r { text-align: right; }
      .fly-head .who { color: var(--muted); }
      .fly-head .val { font-variant-numeric: tabular-nums; font-size: 1.125rem; display: block; }
      .fly-track { display: grid; grid-template-columns: 1fr 2px 1fr; align-items: center; height: 40px; }
      .fly-half { display: flex; height: 100%; align-items: center; }
      .fly-half.l { justify-content: flex-end; }
      .fly-bar { height: 28px; width: 0; transition: width 0.4s ease; border-radius: 2px; }
      .fly-axis { background: var(--ink); height: 40px; }
      .why summary { display: inline; cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; color: var(--link); list-style: none; }
      .why summary::-webkit-details-marker { display: none; }
      .why p { margin: 0.25rem 0 0; }
      .inline { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
      .inline .input { max-width: 7rem; }
      .warn { color: var(--warn); font-family: var(--font-mono); font-size: 0.8125rem; }
      [data-panel="fair"][data-shown="0"] { display: none; }
      table.numbers { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
      table.numbers th, table.numbers td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
      table.numbers td.v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
      table.numbers td.f { color: var(--muted); font-family: var(--font-mono); font-size: 0.75rem; }
      table.numbers td.best { color: var(--go); font-weight: 600; }
      .table-wrap { overflow-x: auto; }
      .feedback-line { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
      @media print { .btn, .chips, [data-lang-toggle], [data-theme-toggle], .feedback-line, details.card:not([open]) { display: none !important; } .card { break-inside: avoid; } }
    </style>
  </head>
  <body>
    <!-- OG view (?og=1, 1200x630) -->
    <section class="og" aria-hidden="true">
      <div><span class="pill" data-i18n="og.kicker"></span></div>
      <div>
        <h1 data-i18n="name"></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <div class="foot">
        <span data-i18n="og.site"></span>
        <span data-site="credit"></span>
      </div>
    </section>

    <main class="tool">
      <header class="tool-header">
        <div class="row">
          <a href="/" data-prefs-link class="muted" style="font-family: var(--font-mono); font-size: 0.75rem; text-decoration: none">FreeToolsLab</a>
          <div class="row">
            <span class="pill"><span data-i18n="status"></span><span class="pill-extra">&nbsp;·&nbsp;<span data-i18n="privacy_short"></span></span></span>
            <button type="button" class="btn btn--ghost" data-theme-toggle>
              <span class="when-light" data-i18n="theme.dark"></span><span class="when-dark" data-i18n="theme.light"></span>
            </button>
            <button type="button" class="btn btn--ghost" data-lang-toggle></button>
          </div>
        </div>
        <h1 data-i18n="name"></h1>
      </header>

      <!-- THE QUESTION: three things -->
      <section class="card ask" aria-labelledby="ask-title">
        <div class="row" style="justify-content: space-between">
          <div class="row"><h2 id="ask-title" data-i18n="inputs.title"></h2><span class="example-hint" data-i18n="inputs.example_hint"></span></div>
          <button type="button" class="btn btn--ghost" data-action="reset" data-i18n="actions.reset"></button>
        </div>
        <div class="chips" role="group" aria-labelledby="who-label">
          <span id="who-label" class="chips-label" data-i18n="inputs.who"></span>
          <button type="button" class="chip" data-who="buyer" data-i18n="inputs.who_buyer"></button>
          <button type="button" class="chip" data-who="supplier" data-i18n="inputs.who_supplier"></button>
        </div>
        <div class="ask-grid">
          <div class="field">
            <label for="spend" data-i18n="inputs.spend.label"></label>
            <div class="input-unit">
              <input id="spend" class="input" type="text" inputmode="numeric" autocomplete="off" data-param="spend" data-money />
              <select id="ccy" class="select select--inline" data-param="ccy" data-i18n-attr="aria-label:inputs.currency">
                <option value="GBP">GBP £</option>
                <option value="USD">USD $</option>
                <option value="EUR">EUR €</option>
                <option value="CNY">CNY ¥</option>
                <option value="RUB">RUB ₽</option>
                <option value="UZS">UZS so'm</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="cur" data-i18n="answer.terms"></label>
            <div class="terms">
              <input id="cur" class="input" type="number" inputmode="numeric" min="0" max="365" step="1" data-param="cur" data-i18n-attr="aria-label:inputs.current.label" />
              <span class="arrow" aria-hidden="true">→</span>
              <input id="next" class="input" type="number" inputmode="numeric" min="0" max="365" step="1" data-param="next" data-i18n-attr="aria-label:inputs.proposed.label" />
              <span class="unit" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted)" data-i18n="inputs.current.unit"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- THE ANSWER -->
      <section class="answer" aria-live="polite">
        <p class="headline" data-out="headline"></p>
        <p class="subline" data-out="subline"></p>
        <div class="stats">
          <div class="stat stat--cash">
            <span class="label" data-i18n="results.cash"></span>
            <span class="value" data-out="cash" data-formula="f1"></span>
          </div>
          <div class="stat" data-card="buyer">
            <span class="label" data-out="buyerLabel"></span>
            <span class="value" data-out="buyer" data-formula="f2"></span>
          </div>
          <div class="stat" data-card="supplier">
            <span class="label" data-out="supplierLabel"></span>
            <span class="value" data-out="supplier" data-formula="f3"></span>
          </div>
          <div class="stat">
            <span class="label" data-out="leakLabel"></span>
            <span class="value" data-out="leak" data-formula="f4"></span>
          </div>
          <div class="stat" data-disc-only hidden>
            <span class="label" data-i18n="results.discount"></span>
            <span class="value" data-out="discount" data-formula="f9"></span>
          </div>
          <div class="stat" data-disc-only hidden>
            <span class="label" data-i18n="results.your_net"></span>
            <span class="value" data-out="yourNet" data-formula="f9"></span>
          </div>
          <div class="stat" data-disc-only hidden>
            <span class="label" data-i18n="results.supplier_net"></span>
            <span class="value" data-out="supplierNet" data-formula="f9"></span>
          </div>
        </div>
        <div class="rates">
          <div class="rates-grid">
            <div class="rate">
              <label for="br"><span data-i18n="inputs.buyer_rate.label"></span>: <b><span data-out="brLabel"></span><span data-i18n="inputs.buyer_rate.unit"></span></b></label>
              <input id="br" class="range" type="range" min="0" max="25" step="0.5" data-param="br" />
              <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-i18n="inputs.buyer_rate.source"></p></details>
            </div>
            <div class="rate">
              <label for="sr"><span data-i18n="inputs.supplier_rate.label"></span>: <b><span data-out="srLabel"></span><span data-i18n="inputs.supplier_rate.unit"></span></b></label>
              <input id="sr" class="range" type="range" min="0" max="40" step="0.5" data-param="sr" />
              <span class="hint" data-out="scfNote"></span>
              <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-i18n="inputs.supplier_rate.source"></p></details>
            </div>
          </div>
          <p class="assumes"><span data-i18n="answer.rates"></span> <a href="#refine" data-action="refine" data-i18n="answer.adjust"></a></p>
        </div>
        <p class="warn" data-out="warnSpend" hidden></p>
      </section>

      <!-- PRIMARY VISUAL: the same days, both sides -->
      <section class="card" aria-labelledby="visual-title">
        <h2 id="visual-title" data-out="vTitle"></h2>
        <div class="fly" data-visual>
          <div class="timeline" aria-hidden="true">
            <div class="line"></div>
            <div class="span" data-tl="span"></div>
            <div class="tick" data-tl="t0" style="left: 0"></div>
            <span class="lbl edge-l" data-tl="l0"></span>
            <div class="tick" data-tl="t1"></div>
            <span class="lbl" data-tl="l1"></span>
            <div class="tick" data-tl="t2"></div>
            <span class="lbl" data-tl="l2"></span>
          </div>
          <div class="fly-head">
            <div class="l"><span class="who" data-out="flyWhoL"></span><span class="val" data-out="flyValL"></span></div>
            <div class="r"><span class="who" data-out="flyWhoR"></span><span class="val" data-out="flyValR"></span></div>
          </div>
          <div class="fly-track" aria-hidden="true">
            <div class="fly-half l"><div class="fly-bar" data-bar="left"></div></div>
            <div class="fly-axis"></div>
            <div class="fly-half"><div class="fly-bar" data-bar="right"></div></div>
          </div>
          <p class="fly-note" data-out="flyNote"></p>
          <p class="fly-sub" data-out="flySub"></p>
        </div>
      </section>

      <!-- The fair alternative (only when relevant) -->
      <section class="card" aria-labelledby="fair-title" data-panel="fair" data-shown="0">
        <h2 id="fair-title" data-i18n="fair.title"></h2>
        <p data-out="fairText"></p>
        <p class="num" style="font-family: var(--font-mono)" data-out="fairValue"></p>
      </section>

      <!-- REFINE (collapsed) -->
      <details class="card" id="refine" data-panel="refine">
        <summary data-i18n="answer.refine"></summary>

        <div class="field">
          <label class="toggle"><input type="checkbox" id="scf" data-param="scf" /> <span data-i18n="inputs.scf.label"></span></label>
          <div class="inline" data-scf-only hidden>
            <label for="spread" class="chips-label" data-i18n="inputs.spread.label"></label>
            <input id="spread" class="input" type="number" inputmode="decimal" min="0" max="20" step="0.1" data-param="spread" />
            <span class="chips-label" data-i18n="inputs.spread.unit"></span>
          </div>
          <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-i18n="inputs.scf.source"></p></details>
        </div>

        <div class="field">
          <label for="srev"><span data-i18n="inputs.supplier_revenue.label"></span><span class="tag" data-i18n="inputs.optional"></span></label>
          <div class="input-unit">
            <input id="srev" class="input" type="text" inputmode="numeric" autocomplete="off" data-param="srev" data-money />
            <span class="unit"><span data-ccy-symbol></span> <span data-i18n="inputs.supplier_revenue.unit"></span></span>
          </div>
          <div class="chips" role="group" aria-labelledby="size-label">
            <span id="size-label" class="chips-label" data-i18n="inputs.size"></span>
            <button type="button" class="chip" data-size="2000000">2m</button>
            <button type="button" class="chip" data-size="20000000">20m</button>
            <button type="button" class="chip" data-size="200000000">200m</button>
          </div>
          <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-i18n="inputs.supplier_revenue.source"></p></details>
        </div>

        <div class="field">
          <label for="m"><span data-i18n="inputs.margin.label"></span><span class="tag" data-i18n="inputs.optional"></span>: <span class="num" data-out="mLabel"></span><span data-i18n="inputs.margin.unit"></span></label>
          <input id="m" class="range" type="range" min="0" max="40" step="0.5" data-param="m" />
          <div class="chips" role="group" aria-labelledby="margin-label">
            <span id="margin-label" class="chips-label" data-i18n="inputs.margin_presets"></span>
            <button type="button" class="chip" data-margin="3" data-i18n="inputs.preset_distributor"></button>
            <button type="button" class="chip" data-margin="8" data-i18n="inputs.preset_manufacturer"></button>
            <button type="button" class="chip" data-margin="15" data-i18n="inputs.preset_services"></button>
          </div>
          <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-i18n="inputs.margin.source"></p></details>
        </div>

        <div class="field">
          <label for="disc"><span data-i18n="inputs.disc.label"></span><span class="tag" data-i18n="inputs.optional"></span></label>
          <div class="inline">
            <input id="disc" class="input" type="number" inputmode="decimal" min="0" max="20" step="0.1" data-param="disc" />
            <span class="chips-label" data-i18n="inputs.disc.unit"></span>
            <button type="button" class="chip" data-preset="30,10,2" data-i18n="inputs.preset_early"></button>
          </div>
          <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-i18n="inputs.disc.source"></p></details>
        </div>
      </details>

      <!-- COMPARE (collapsed) -->
      <details class="card" data-panel="compare">
        <summary data-i18n="inputs.cmp"></summary>
        <div class="grid-2">
          <div class="field">
            <label for="next2" data-i18n="inputs.next2.label"></label>
            <div class="input-unit">
              <input id="next2" class="input" type="number" inputmode="numeric" min="0" max="365" step="1" data-param="next2" />
              <span class="unit" data-i18n="inputs.next2.unit"></span>
            </div>
          </div>
          <div class="field">
            <label for="disc2" data-i18n="inputs.disc2.label"></label>
            <div class="input-unit">
              <input id="disc2" class="input" type="number" inputmode="decimal" min="0" max="20" step="0.1" data-param="disc2" />
              <span class="unit" data-i18n="inputs.disc2.unit"></span>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table class="numbers">
            <thead><tr><th></th><th data-i18n="compare.a"></th><th data-i18n="compare.b"></th></tr></thead>
            <tbody data-out="compareBody"></tbody>
          </table>
        </div>
        <p style="font-family: var(--font-mono); font-size: 0.875rem" data-out="compareVerdict"></p>
      </details>

      <!-- Actions -->
      <section class="row">
        <button type="button" class="btn btn--primary" data-action="copy"><span data-i18n="actions.copy"></span></button>
        <button type="button" class="btn" data-action="png"><span data-i18n="actions.png"></span></button>
        <button type="button" class="btn btn--ghost" data-action="more" aria-expanded="false"><span data-i18n="actions.more"></span> ▾</button>
        <span data-more hidden style="display: contents">
          <button type="button" class="btn" data-action="link"><span data-i18n="actions.link"></span></button>
          <button type="button" class="btn" data-action="csv"><span data-i18n="actions.csv"></span></button>
        </span>
        <span class="muted" style="font-family: var(--font-mono); font-size: 0.75rem" data-out="status" role="status"></span>
      </section>
      <p class="feedback-line">
        <a data-feedback-mail data-i18n="actions.feedback"></a>
        · <a data-feedback-github target="_blank" rel="noopener noreferrer" data-i18n="actions.feedback_github"></a>
      </p>

      <!-- All numbers (collapsed) -->
      <details class="card">
        <summary data-i18n="table.title"></summary>
        <div class="table-wrap">
          <table class="numbers">
            <thead><tr><th data-i18n="table.metric"></th><th data-i18n="table.value"></th><th data-i18n="table.formula"></th></tr></thead>
            <tbody data-out="tableBody"></tbody>
          </table>
        </div>
      </details>

      <!-- Assumptions (collapsed) -->
      <details class="card assumptions">
        <summary data-i18n="assumptions.title"></summary>
        <ul>
          <li><code data-i18n="assumptions.f1"></code></li>
          <li><code data-i18n="assumptions.f2"></code></li>
          <li><code data-i18n="assumptions.f3"></code></li>
          <li><code data-i18n="assumptions.f4"></code></li>
          <li><code data-i18n="assumptions.f5"></code></li>
          <li><code data-i18n="assumptions.f6"></code></li>
          <li><code data-i18n="assumptions.f7"></code></li>
          <li><code data-i18n="assumptions.f8"></code></li>
          <li><code data-i18n="assumptions.f9"></code></li>
        </ul>
        <p data-i18n="assumptions.note"></p>
        <p data-i18n="assumptions.disclaimer"></p>
        <p data-i18n="privacy"></p>
      </details>

      <footer class="credit">
        <a data-site="linkedin" rel="noopener noreferrer" target="_blank"><span data-site="credit"></span></a>
