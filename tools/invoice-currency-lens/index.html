<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Invoice Currency Lens · FreeToolsLab</title>
    <meta name="description" content="Two quotes, two currencies, paid in a third: which one is cheaper after your bank's rates and fees." />
    <meta property="og:title" content="Invoice Currency Lens · FreeToolsLab" />
    <meta property="og:description" content="Two quotes, two currencies, paid in a third: which one is cheaper after your bank's rates and fees." />
    <meta property="og:image" content="https://www.freetoolslab.org/tools/invoice-currency-lens/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/tool.css" />
    <style>
      .tool { gap: 1.25rem; }
      .ask { display: grid; gap: 1rem; }
      .quotes { display: grid; gap: 1rem; }
      @media (min-width: 640px) { .quotes { grid-template-columns: 1fr 1fr; } }
      .quote { display: grid; gap: 0.6rem; padding: 0.875rem; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel-2); }
      .quote h3 { font-size: 0.8125rem; color: var(--muted); font-weight: 500; }
      .quote .amount { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; }
      .select--inline { width: auto; padding: 0.35rem 0.5rem; font-family: var(--font-mono); font-size: 0.8125rem; }
      .rate label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.25rem; }
      .rate .input-unit .unit { min-width: 4ch; }
      .top-row { display: grid; gap: 1rem; }
      @media (min-width: 640px) { .top-row { grid-template-columns: 1fr 1fr; } }
      .headline { font-size: clamp(1.25rem, 3.2vw, 1.75rem); line-height: 1.3; font-weight: 500; }
      .subline { font-size: 1rem; color: var(--muted); line-height: 1.5; }
      .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      @media (min-width: 768px) { .stats { grid-template-columns: repeat(4, 1fr); } }
      .stat { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); padding: 0.75rem 0.875rem; display: grid; gap: 0.25rem; }
      .stat .label { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted); }
      .stat .value { font-family: var(--font-mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
      .stat .sub { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted); }
      .stat--go .value { color: var(--go); }
      .stat--stop .value { color: var(--stop); }
      .stat--cash .value { color: var(--link); }
      .example-hint { font-size: 0.8125rem; color: var(--muted); }
      .cross-line { font-size: 0.9375rem; }
      /* bars */
      .bars { display: grid; gap: 1rem; }
      .brow { display: grid; gap: 0.4rem; }
      .brow .lbl { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
      .brow .lbl .who { color: var(--muted); }
      .track { position: relative; height: 34px; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
      .seg { position: absolute; top: 0; bottom: 0; transition: left 0.4s ease, width 0.4s ease; }
      .seg--base { background: var(--link); }
      .seg--fee { background: var(--warn); }
      .seg--move { background: var(--stop); opacity: 0.85; }
      .seg--move.neg { background: var(--go); }
      .flipmark { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); }
      .flipmark::after { content: attr(data-label); position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted); white-space: nowrap; }
      .brow.best .track { border-color: var(--go); box-shadow: 0 0 0 2px var(--go-soft); }
      .legend { display: flex; flex-wrap: wrap; gap: 1rem; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
      .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 0.35rem; vertical-align: -1px; }
      details.card > summary { cursor: pointer; font-family: var(--font-mono); font-size: 0.8125rem; color: var(--link); list-style: none; }
      details.card > summary::-webkit-details-marker { display: none; }
      details.card > summary::before { content: "+ "; }
      details.card[open] > summary::before { content: "− "; }
      .why summary { display: inline; cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; color: var(--link); list-style: none; }
      .why summary::-webkit-details-marker { display: none; }
      .why p { margin: 0.25rem 0 0; }
      .refine-grid { display: grid; gap: 1rem; }
      @media (min-width: 640px) { .refine-grid { grid-template-columns: 1fr 1fr; } }
      .tag { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted); border: 1px solid var(--rule-2); border-radius: 999px; padding: 0 0.4rem; margin-left: 0.4rem; vertical-align: middle; }
      table.numbers { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
      table.numbers th, table.numbers td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
      table.numbers td.v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
      table.numbers td.f { color: var(--muted); font-family: var(--font-mono); font-size: 0.75rem; }
      .table-wrap { overflow-x: auto; }
      .feedback-line { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
      @media print { .btn, [data-lang-toggle], [data-theme-toggle], .feedback-line, details.card:not([open]) { display: none !important; } }
    </style>
  </head>
  <body>
    <section class="og" aria-hidden="true">
      <div><span class="pill" data-i18n="og.kicker"></span></div>
      <div>
        <h1 data-i18n="name"></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <div class="foot">
        <span data-i18n="og.site"></span>
        <span data-site="credit"></span>
      </div>
    </section>

    <main class="tool">
      <header class="tool-header">
        <div class="row">
          <a href="/" data-prefs-link class="muted" style="font-family: var(--font-mono); font-size: 0.75rem; text-decoration: none">FreeToolsLab</a>
          <div class="row">
            <span class="pill"><span data-i18n="status"></span>&nbsp;·&nbsp;<span data-i18n="privacy_short"></span></span>
            <button type="button" class="btn btn--ghost" data-theme-toggle>
              <span class="when-light" data-i18n="theme.dark"></span><span class="when-dark" data-i18n="theme.light"></span>
            </button>
            <button type="button" class="btn btn--ghost" data-lang-toggle></button>
          </div>
        </div>
        <h1 data-i18n="name"></h1>
      </header>

      <!-- THE QUESTION -->
      <section class="card ask" aria-labelledby="ask-title">
        <div class="row" style="justify-content: space-between">
          <div class="row"><h2 id="ask-title" data-i18n="inputs.title"></h2><span class="example-hint" data-i18n="inputs.example_hint"></span></div>
          <button type="button" class="btn btn--ghost" data-action="reset" data-i18n="actions.reset"></button>
        </div>

        <div class="top-row">
          <div class="field">
            <label for="home" data-i18n="inputs.home"></label>
            <select id="home" class="select" data-param="home">
              <option value="UZS">UZS so'm</option>
              <option value="KZT">KZT ₸</option>
              <option value="RUB">RUB ₽</option>
              <option value="USD">USD $</option>
              <option value="EUR">EUR €</option>
              <option value="GBP">GBP £</option>
              <option value="CNY">CNY ¥</option>
            </select>
          </div>
          <div class="field">
            <label for="days" data-i18n="inputs.days"></label>
            <div class="input-unit">
              <input id="days" class="input" type="number" inputmode="numeric" min="0" max="365" step="1" data-param="days" />
              <span class="unit" data-i18n="inputs.days_unit"></span>
            </div>
          </div>
        </div>

        <div class="quotes">
          <div class="quote">
            <h3 data-i18n="inputs.quote_a"></h3>
            <div class="amount">
              <input id="amtA" class="input" type="text" inputmode="numeric" autocomplete="off" data-param="amtA" data-money data-i18n-attr="aria-label:inputs.amount" />
              <select id="ccyA" class="select select--inline" data-param="ccyA" aria-label="Currency A">
                <option value="KZT">KZT</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="RUB">RUB</option><option value="CNY">CNY</option><option value="GBP">GBP</option><option value="UZS">UZS</option>
              </select>
            </div>
            <div class="rate">
              <label for="rateA"><span data-out="rateLabelA"></span></label>
              <div class="input-unit">
                <input id="rateA" class="input" type="number" inputmode="decimal" min="0" step="any" data-param="rateA" />
                <span class="unit" data-out="homeA"></span>
              </div>
              <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-out="rateHintA"></p></details>
            </div>
          </div>
          <div class="quote">
            <h3 data-i18n="inputs.quote_b"></h3>
            <div class="amount">
              <input id="amtB" class="input" type="text" inputmode="numeric" autocomplete="off" data-param="amtB" data-money data-i18n-attr="aria-label:inputs.amount" />
              <select id="ccyB" class="select select--inline" data-param="ccyB" aria-label="Currency B">
                <option value="USD">USD</option><option value="KZT">KZT</option><option value="EUR">EUR</option><option value="RUB">RUB</option><option value="CNY">CNY</option><option value="GBP">GBP</option><option value="UZS">UZS</option>
              </select>
            </div>
            <div class="rate">
              <label for="rateB"><span data-out="rateLabelB"></span></label>
              <div class="input-unit">
                <input id="rateB" class="input" type="number" inputmode="decimal" min="0" step="any" data-param="rateB" />
                <span class="unit" data-out="homeB"></span>
              </div>
              <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-out="rateHintB"></p></details>
            </div>
          </div>
        </div>
      </section>

      <!-- THE ANSWER -->
      <section class="answer" aria-live="polite" style="display: grid; gap: 1rem">
        <p class="headline" data-out="headline"></p>
        <p class="subline" data-out="subline"></p>
        <div class="stats">
          <div class="stat" data-card="a">
            <span class="label" data-out="labelA"></span>
            <span class="value" data-out="costA"></span>
            <span class="sub" data-out="subA"></span>
          </div>
          <div class="stat" data-card="b">
            <span class="label" data-out="labelB"></span>
            <span class="value" data-out="costB"></span>
            <span class="sub" data-out="subB"></span>
          </div>
          <div class="stat stat--cash">
            <span class="label" data-i18n="results.diff"></span>
            <span class="value" data-out="diff"></span>
            <span class="sub" data-out="diffPct"></span>
          </div>
          <div class="stat">
            <span class="label" data-i18n="results.cross_sup"></span>
            <span class="value" data-out="crossSup"></span>
            <span class="sub" data-out="crossBank"></span>
          </div>
        </div>
        <p class="cross-line" data-out="crossLine"></p>
      </section>

      <!-- PRIMARY VISUAL -->
      <section class="card" aria-labelledby="visual-title">
        <h2 id="visual-title" data-out="vTitle"></h2>
        <div class="bars" data-visual>
          <div class="brow" data-brow="a">
            <div class="lbl"><span class="who" data-out="bLabelA"></span><span data-out="bValA"></span></div>
            <div class="track">
              <div class="seg seg--base" data-seg="baseA"></div>
              <div class="seg seg--fee" data-seg="feeA"></div>
              <div class="seg seg--move" data-seg="moveA"></div>
              <div class="flipmark" data-flip="a" hidden></div>
            </div>
          </div>
          <div class="brow" data-brow="b">
            <div class="lbl"><span class="who" data-out="bLabelB"></span><span data-out="bValB"></span></div>
            <div class="track">
              <div class="seg seg--base" data-seg="baseB"></div>
              <div class="seg seg--fee" data-seg="feeB"></div>
              <div class="seg seg--move" data-seg="moveB"></div>
              <div class="flipmark" data-flip="b" hidden></div>
            </div>
          </div>
          <div class="legend">
            <span><i style="background: var(--link)"></i><span data-i18n="visual.base"></span></span>
            <span><i style="background: var(--warn)"></i><span data-i18n="visual.fee"></span></span>
            <span><i style="background: var(--stop)"></i><span data-i18n="visual.move"></span></span>
          </div>
        </div>
      </section>

      <!-- REFINE -->
      <details class="card" id="refine" data-panel="refine">
        <summary data-i18n="inputs.refine"></summary>
        <div class="refine-grid">
          <div class="field">
            <label for="feeA"><span data-out="feeLabelA"></span><span class="tag" data-i18n="inputs.optional"></span></label>
            <div class="input-unit"><input id="feeA" class="input" type="number" inputmode="decimal" min="0" max="20" step="0.1" data-param="feeA" /><span class="unit">%</span></div>
            <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-out="feeHintA"></p></details>
          </div>
          <div class="field">
            <label for="feeB"><span data-out="feeLabelB"></span><span class="tag" data-i18n="inputs.optional"></span></label>
            <div class="input-unit"><input id="feeB" class="input" type="number" inputmode="decimal" min="0" max="20" step="0.1" data-param="feeB" /><span class="unit">%</span></div>
            <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-out="feeHintB"></p></details>
          </div>
          <div class="field">
            <label for="moveA"><span data-out="moveLabelA"></span><span class="tag" data-i18n="inputs.optional"></span></label>
            <div class="input-unit"><input id="moveA" class="input" type="number" inputmode="decimal" min="-50" max="100" step="0.5" data-param="moveA" /><span class="unit">%</span></div>
            <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-out="moveHintA"></p></details>
          </div>
          <div class="field">
            <label for="moveB"><span data-out="moveLabelB"></span><span class="tag" data-i18n="inputs.optional"></span></label>
            <div class="input-unit"><input id="moveB" class="input" type="number" inputmode="decimal" min="-50" max="100" step="0.5" data-param="moveB" /><span class="unit">%</span></div>
            <details class="why"><summary data-i18n="inputs.why"></summary><p class="hint" data-out="moveHintB"></p></details>
          </div>
        </div>
      </details>

      <!-- Actions -->
      <section class="row">
        <button type="button" class="btn btn--primary" data-action="copy"><span data-i18n="actions.copy"></span></button>
        <button type="button" class="btn" data-action="png"><span data-i18n="actions.png"></span></button>
        <button type="button" class="btn btn--ghost" data-action="more" aria-expanded="false"><span data-i18n="actions.more"></span> ▾</button>
        <span data-more hidden style="display: contents">
          <button type="button" class="btn" data-action="link"><span data-i18n="actions.link"></span></button>
          <button type="button" class="btn" data-action="csv"><span data-i18n="actions.csv"></span></button>
        </span>
        <span class="muted" style="font-family: var(--font-mono); font-size: 0.75rem" data-out="status" role="status"></span>
      </section>
      <p class="feedback-line">
        <a data-feedback-mail data-i18n="actions.feedback"></a>
        · <a data-feedback-github target="_blank" rel="noopener noreferrer" data-i18n="actions.feedback_github"></a>
      </p>

      <details class="card">
        <summary data-i18n="table.title"></summary>
        <div class="table-wrap">
          <table class="numbers">
            <thead><tr><th data-i18n="table.metric"></th><th data-i18n="table.value"></th><th data-i18n="table.formula"></th></tr></thead>
            <tbody data-out="tableBody"></tbody>
          </table>
        </div>
      </details>

      <details class="card assumptions">
        <summary data-i18n="assumptions.title"></summary>
        <ul>
          <li><code data-i18n="assumptions.f1"></code></li>
          <li><code data-i18n="assumptions.f2"></code></li>
          <li><code data-i18n="assumptions.f3"></code></li>
          <li><code data-i18n="assumptions.f4"></code></li>
          <li><code data-i18n="assumptions.f5"></code></li>
        </ul>
        <p data-i18n="assumptions.note"></p>
        <p data-i18n="assumptions.disclaimer"></p>
        <p data-i18n="privacy"></p>
      </details>

      <footer class="credit">
        <a data-site="linkedin" rel="noopener noreferrer" target="_blank"><span data-site="credit"></span></a>
        <a href="/support/" data-prefs-link data-i18n="credit.support"></a>
        <a href="/subscribe/" data-prefs-link data-i18n="credit.subscribe"></a>
      </footer>
    </main>

    <script type="module" src="./tool.js"></script>
  </body>
</html>
